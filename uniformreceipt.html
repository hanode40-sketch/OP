<style>
  :root {

  button:hover { background: var(--surface-1); }
  label { font-size:13px; color: var(--text-secondary); }
</style>

const SHIRT_SIZES=['S','M','L','XL','2XL','3XL','4XL','5XL'];
const PANT_SIZES=Array.from({length:54-28+1},(_,i)=>String(28+i));
const SHOE_SIZES=Array.from({length:48-36+1},(_,i)=>String(36+i));
const JACKET_SIZES=['S','M','L','XL','2XL','3XL','4XL','5XL','8XL'];
const ONE_SIZE=['One size','S','M','L','XL'];

const EMP_DB={};
EMP_DATA.forEach(r=>{ EMP_DB[r[0]] = {name:r[1], shirt:r[2].toUpperCase(), pant:r[3], shoes:r[4], jacket:r[5].toUpperCase(), empId:r[6]}; });

// Local storage-backed persistence (works fully offline, per-browser)
function loadStore(){
  try { return JSON.parse(localStorage.getItem('nwb_uniform_receipts')||'[]'); } catch(e){ return []; }
}
function saveStore(arr){
  try {
    localStorage.setItem('nwb_uniform_receipts', JSON.stringify(arr));
    return true;
  } catch(e) {
    return false;
  }
}

(function checkStorage(){
  try {
    const testKey='__nwb_test__';
    localStorage.setItem(testKey,'1');
    localStorage.removeItem(testKey);
  } catch(e) {
    const w=document.getElementById('storage-warning');
    if(w) w.style.display='block';
  }
})();

function defaultItems(){
  return [
    {name:'Shirt', size:'M', qty:1, include:true, sizes:SHIRT_SIZES},
    {name:'Jacket', size:'M', qty:1, include:true, sizes:JACKET_SIZES},
    {name:'Pant', size:'40', qty:1, include:true, sizes:PANT_SIZES},
    {name:'Shoes', size:'42', qty:1, include:true, sizes:SHOE_SIZES},
    {name:'Belt', size:'One size', qty:1, include:true, sizes:ONE_SIZE},
    {name:'Socks', size:'One size', qty:2, include:true, sizes:ONE_SIZE},
    {name:'Cap', size:'One size', qty:1, include:true, sizes:ONE_SIZE},
    {name:'Epaulettes', size:'One size', qty:1, include:true, sizes:ONE_SIZE},
    {name:'Tie', size:'One size', qty:1, include:true, sizes:ONE_SIZE}
  ];
}
let items=defaultItems();
const itemsList=document.getElementById('items-list');
function renderItems(){
  itemsList.innerHTML='';
  items.forEach((it,i)=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius);background:#fff';
    const sizeOpts=it.sizes.map(s=>`<option value="${s}" ${s===it.size?'selected':''}>${s}</option>`).join('');
    row.innerHTML=`
      <input data-i="${i}" class="item-inc" type="checkbox" ${it.include?'checked':''} style="width:16px;height:16px;flex-shrink:0"/>
      <span style="flex:2;font-size:14px">${it.name}</span>
      <select data-i="${i}" class="item-size" style="flex:1">${sizeOpts}</select>
      <input data-i="${i}" class="item-qty" type="number" min="0" value="${it.qty}" style="width:56px;flex-shrink:0"/>
    `;
    itemsList.appendChild(row);
  });
  itemsList.querySelectorAll('.item-inc').forEach(inp=>inp.addEventListener('change',e=>{items[+e.target.dataset.i].include=e.target.checked;}));
  itemsList.querySelectorAll('.item-size').forEach(sel=>sel.addEventListener('change',e=>{items[+e.target.dataset.i].size=e.target.value;}));
  itemsList.querySelectorAll('.item-qty').forEach(inp=>inp.addEventListener('input',e=>{
    let v=parseInt(e.target.value);
    if(isNaN(v)||v<0) v=0;
    items[+e.target.dataset.i].qty=v;
  }));
}
renderItems();

const idInput=document.getElementById('drv-id');
const nameInput=document.getElementById('drv-name');
const statusEl=document.getElementById('lookup-status');
const suggestBox=document.getElementById('iqama-suggestions');

function applySizesFor(rec){
  nameInput.value=rec.name;
  const setSize=(itemName,val)=>{
    const it=items.find(x=>x.name===itemName);
    if(it && val){
      if(!it.sizes.includes(val)) it.sizes=[val, ...it.sizes];
      it.size=val;
    }
  };
  setSize('Shirt', rec.shirt);
  setSize('Jacket', rec.jacket);
  setSize('Pant', rec.pant);
  setSize('Shoes', rec.shoes);
  renderItems();
  statusEl.textContent='Sizes auto-filled for this employee — you can still edit them';
  statusEl.style.color='var(--text-success)';
}
function hideSuggestions(){
  suggestBox.style.display='none';
  suggestBox.innerHTML='';
}
function renderSuggestions(query){
  if(!query){ hideSuggestions(); return; }
  const matches=EMP_DATA.filter(r=>r[0].includes(query)).slice(0,8);
  if(matches.length===0){ hideSuggestions(); return; }
  suggestBox.innerHTML=matches.map(r=>
    `<div class="iqama-suggestion" data-iqama="${r[0]}" style="padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)">
       <div style="font-weight:600">${r[0]}</div>
       <div style="color:var(--text-secondary)">${r[1]}</div>
     </div>`
  ).join('');
  suggestBox.style.display='block';
  suggestBox.querySelectorAll('.iqama-suggestion').forEach(el=>{
    el.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      const iqama=el.dataset.iqama;
      idInput.value=iqama;
      const rec=EMP_DB[iqama];
      if(rec) applySizesFor(rec);
      hideSuggestions();
    });
    el.addEventListener('mouseenter', ()=>{ el.style.background='var(--surface-1)'; });
    el.addEventListener('mouseleave', ()=>{ el.style.background=''; });
  });
}
idInput.addEventListener('input',()=>{
  const query=idInput.value.trim();
  const rec=EMP_DB[query];
  if(rec){
    applySizesFor(rec);
  } else if(query){
    statusEl.textContent='Iqama not found in the size sheet — enter name and sizes manually';
    statusEl.style.color='var(--text-muted)';
  } else {
    statusEl.textContent='';
  }
  renderSuggestions(query);
});
idInput.addEventListener('focus',()=>{ renderSuggestions(idInput.value.trim()); });
idInput.addEventListener('blur',()=>{ setTimeout(hideSuggestions, 100); });
document.addEventListener('click',(e)=>{
  if(e.target!==idInput && !suggestBox.contains(e.target)) hideSuggestions();
});

let instrValue=null;
document.querySelectorAll('.instr-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    instrValue=btn.dataset.val;
    document.querySelectorAll('.instr-btn').forEach(b=>{
      b.style.fontWeight='400'; b.style.borderColor='var(--border-strong)'; b.style.background='#fff';
    });
    if(instrValue==='yes'){
      btn.style.fontWeight='600'; btn.style.background='var(--bg-success)'; btn.style.borderColor='var(--border-success)';
    } else {
      btn.style.fontWeight='600'; btn.style.background='var(--bg-danger)'; btn.style.borderColor='var(--border-danger)';
    }
  });
});

let photoDataUrl=null;
const photoInput=document.getElementById('photo-input');
const photoPreview=document.getElementById('photo-preview');
const photoRemove=document.getElementById('photo-remove');
photoInput.addEventListener('change',()=>{
  const file=photoInput.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=700;
      const scale=Math.min(1, maxW/img.width);
      const cw=Math.round(img.width*scale), ch=Math.round(img.height*scale);
      const c=document.createElement('canvas');
      c.width=cw; c.height=ch;
      c.getContext('2d').drawImage(img,0,0,cw,ch);
      photoDataUrl=c.toDataURL('image/jpeg',0.6);
      photoPreview.src=photoDataUrl;
      photoPreview.style.display='inline-block';
      photoRemove.style.display='inline-block';
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});
photoRemove.addEventListener('click',()=>{
  photoDataUrl=null; photoInput.value='';
  photoPreview.style.display='none'; photoRemove.style.display='none';
});

const canvas=document.getElementById('sig-pad');
const ctx=canvas.getContext('2d');
ctx.strokeStyle='#000';
ctx.lineWidth=2; ctx.lineCap='round';
let drawing=false, hasSig=false;
function pos(e){
  const r=canvas.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return {x:cx*canvas.width/r.width, y:cy*canvas.height/r.height};
}
function start(e){drawing=true;hasSig=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();}
function move(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();}
function end(){drawing=false;}
canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
canvas.addEventListener('touchstart',start);canvas.addEventListener('touchmove',move);canvas.addEventListener('touchend',end);
document.getElementById('clear-sig').addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasSig=false;});

const errEl=document.getElementById('form-error');
const okEl=document.getElementById('form-success');
document.getElementById('submit-form').addEventListener('click', ()=>{
  errEl.style.display='none'; okEl.style.display='none';
  const name=nameInput.value.trim();
  const id=idInput.value.trim();
  const chosen=items.filter(it=>it.include);
  if(!name||!id){errEl.textContent='Please fill in the driver name and Iqama number';errEl.style.display='block';return;}
  if(chosen.length===0){errEl.textContent='Select at least one item';errEl.style.display='block';return;}
  if(!instrValue){errEl.textContent='Please confirm whether the instructions sheet was received';errEl.style.display='block';return;}
  if(!photoDataUrl){errEl.textContent='Please take a receipt photo before saving';errEl.style.display='block';return;}
  if(!hasSig){errEl.textContent='Please have the driver sign before saving';errEl.style.display='block';return;}
  const record={
    recordId: Date.now()+'_'+Math.random().toString(36).slice(2,8),
    driverName:name, driverId:id,
    items:chosen.map(it=>({name:it.name,size:it.size,qty:it.qty})),
    instructionsReceived: instrValue==='yes',
    photo:photoDataUrl,
    signature:canvas.toDataURL('image/png'),
    date:new Date().toISOString()
  };
  const store = loadStore();
  store.push(record);
  const ok = saveStore(store);
  if(!ok){
    errEl.textContent='Could not save: browser storage is full or unavailable. Export your existing records first, then try again with a smaller photo.';
    errEl.style.display='block';
    return;
  }
  okEl.style.display='block';
  idInput.value=''; nameInput.value=''; statusEl.textContent=''; hideSuggestions();
  items=defaultItems(); renderItems();
  ctx.clearRect(0,0,canvas.width,canvas.height); hasSig=false;
  photoDataUrl=null; photoInput.value=''; photoPreview.style.display='none'; photoRemove.style.display='none';
  instrValue=null;
  document.querySelectorAll('.instr-btn').forEach(b=>{ b.style.fontWeight='400'; b.style.background='#fff'; b.style.borderColor='var(--border-strong)'; });
});

const tabForm=document.getElementById('tab-form');
const tabAdmin=document.getElementById('tab-admin');
const viewForm=document.getElementById('view-form');
const viewAdmin=document.getElementById('view-admin');
tabForm.addEventListener('click',()=>{

tabAdmin.addEventListener('click',()=>{

  loadRecords();
});

let allRecords=[];
function loadRecords(){
  const wrap=document.getElementById('records-wrap');
  const emptyMsg=document.getElementById('empty-msg');
  allRecords = loadStore().slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  wrap.innerHTML='';
  document.getElementById('record-count').textContent=allRecords.length+' records';
  if(allRecords.length===0){emptyMsg.style.display='block';return;}
  emptyMsg.style.display='none';
  allRecords.forEach(rec=>{
    const card=document.createElement('div');
    card.style.cssText='background:#fff;border-radius:12px;border:1px solid var(--border);padding:1rem 1.25rem';
    const itemsStr=rec.items.map(it=>it.name+' ('+it.size+') x'+it.qty).join(', ');
    const d=new Date(rec.date);
    const instrText = rec.instructionsReceived ? 'Instructions sheet received' : 'Instructions sheet NOT received';
    const instrColor = rec.instructionsReceived ? 'var(--text-success)' : 'var(--text-danger)';
    const photoHtml=rec.photo?`<img src="${rec.photo}" style="height:56px;border-radius:6px;border:1px solid var(--border);margin-right:8px"/>`:'';
    card.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <p style="font-weight:600;font-size:15px;margin:0">${rec.driverName}</p>
          <p style="font-size:13px;color:var(--text-secondary);margin:0">Iqama: ${rec.driverId}</p>
        </div>
        <span style="font-size:12px;color:var(--text-muted)">${d.toLocaleDateString('en-GB')}</span>
      </div>
      <p style="font-size:13px;margin:0 0 4px">${itemsStr}</p>
      <p style="font-size:12px;margin:0 0 8px;color:${instrColor}">${instrText}</p>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center">
          ${photoHtml}
          <img src="${rec.signature}" style="height:50px;border:1px solid var(--border);border-radius:6px;background:#fff"/>
        </div>
        <button class="delete-record-btn" data-record-key="${rec.recordId||rec.date}" style="font-size:12px;color:var(--text-danger);border-color:var(--border-danger)">Delete</button>
      </div>
    `;
    wrap.appendChild(card);
  });
  wrap.querySelectorAll('.delete-record-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key=btn.dataset.recordKey;
      const rec=allRecords.find(r=>(r.recordId||r.date)===key);
      const label = rec ? (rec.driverName+' ('+rec.driverId+')') : 'this record';
      if(!confirm('Delete the record for '+label+'? This cannot be undone.')) return;
      const store=loadStore().filter(r=>(r.recordId||r.date)!==key);
      saveStore(store);
      loadRecords();
    });
  });
}

document.getElementById('export-btn').addEventListener('click', async ()=>{
  if(allRecords.length===0)return;
  const exportBtn=document.getElementById('export-btn');
  exportBtn.disabled=true;
  const origText=exportBtn.textContent;
  exportBtn.textContent='Preparing file...';
  try{
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet('Uniform Receipts');
    ws.columns=[
      {header:'Driver name', key:'name', width:22},
      {header:'Iqama Number', key:'id', width:16},
      {header:'Date', key:'date', width:20},
      {header:'Items (size x qty)', key:'items', width:50},
      {header:'Instructions sheet received', key:'instr', width:16},
      {header:'Photo', key:'photo', width:16},
      {header:'Signature', key:'sig', width:16}
    ];
    ws.getRow(1).font={bold:true};

    for(const r of allRecords){
      const itemsStr=r.items.map(it=>it.name+' ('+it.size+') x'+it.qty).join(' | ');
      const row=ws.addRow({
        name:r.driverName,
        id:r.driverId,
        date:new Date(r.date).toLocaleString('en-GB'),
        items:itemsStr,
        instr:r.instructionsReceived?'Yes':'No'
      });
      row.height=70;
      const rowNum=row.number;

      if(r.photo){
        const ext=r.photo.startsWith('data:image/png')?'png':'jpeg';
        const imgId=wb.addImage({base64:r.photo, extension:ext});
        ws.addImage(imgId, {
          tl:{col:5, row:rowNum-1},
          ext:{width:90, height:90}
        });
      }
      if(r.signature){
        const sigId=wb.addImage({base64:r.signature, extension:'png'});
        ws.addImage(sigId, {
          tl:{col:6, row:rowNum-1},
          ext:{width:120, height:60}
        });
      }
    }

    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='uniform_receipts.xlsx'; a.click();
    URL.revokeObjectURL(url);
  } catch(e){
    alert('Could not build the Excel file: '+e.message);
  } finally {
    exportBtn.disabled=false;
    exportBtn.textContent=origText;
  }
});
</script>
</div>
</body>
</html>
